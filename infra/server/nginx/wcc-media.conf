# Nginx site for the WCC Media API. Installed by setup.sh as
# /etc/nginx/sites-available/wcc-media.conf (__API_DOMAIN__ / __PROXY_SECRET__ filled in).
#
# The web app runs on Vercel and proxies /api/* here, so the browser only ever
# talks to the Vercel origin. Requests therefore arrive from Vercel's IPs; the
# real visitor IP comes in X-WCC-Client-IP and is trusted ONLY when the request
# carries the shared X-WCC-Proxy-Key (set in Vercel as API_PROXY_SECRET).
# Anyone calling this host directly is rate-limited by their own address.
#
# Starts as plain HTTP, then:  sudo certbot --nginx -d __API_DOMAIN__ --redirect

map $http_x_wcc_proxy_key $wcc_via_vercel {
    default            0;
    "__PROXY_SECRET__" 1;
}
map "$wcc_via_vercel:$http_x_wcc_client_ip" $wcc_client_ip {
    "~^1:(?<ip>[0-9a-fA-F:.]{3,45})$" $ip;
    default                            $remote_addr;
}

limit_req_zone $wcc_client_ip zone=wcc_api:10m rate=30r/s;
limit_req_zone $wcc_client_ip zone=wcc_auth:10m rate=10r/m;
limit_req_zone $wcc_client_ip zone=wcc_public:10m rate=10r/s;

upstream wcc_api { server 127.0.0.1:5070; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMAIN__;

    # JSON only; uploads go browser → S3 directly.
    client_max_body_size 2m;

    access_log /var/log/nginx/wcc-media.access.log;
    error_log  /var/log/nginx/wcc-media.error.log warn;

    # Shared proxy settings, with the trusted client IP (not Vercel's).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $wcc_client_ip;
    proxy_set_header X-Forwarded-For $wcc_client_ip;   # the API trusts exactly one hop
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-WCC-Proxy-Key "";               # never forwarded to the app
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    location ~ ^/api/v1/(auth/(login|forgot-password|reset-password)|invitations/accept|public/shares/[^/]+/unlock) {
        limit_req zone=wcc_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://wcc_api;
    }

    location /api/v1/public/ {
        limit_req zone=wcc_public burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://wcc_api;
    }

    location /api/ {
        # Multipart part signing for big videos is bursty.
        limit_req zone=wcc_api burst=200 nodelay;
        limit_req_status 429;
        proxy_pass http://wcc_api;
    }

    # Nothing else is served from this host (the web app is on Vercel).
    location / { return 404; }
    location ~ /\.(?!well-known) { deny all; }
}
