packages:
  - apps/*
  - packages/*

# pnpm 11 blocks dependency lifecycle scripts unless each is decided here.
allowBuilds:
  argon2: true            # native password hashing — required
  sharp: true             # native image processing — required
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  "@nestjs/core": true
  esbuild: true
  unrs-resolver: true
  "@scarf/scarf": false
  msgpackr-extract: false
  core-js: false
